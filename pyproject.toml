[project]
name = "shotlock"
version = "0.0.1"
description = "Convert approved edit requests into measurable preservation constraints and evidence about what an AI edit changed."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = []

[project.optional-dependencies]
dev = ["bandit"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.bandit]
# Analysis tooling processes untrusted media paths from review packages; the
# subprocess call in media.py uses an argument list (never a shell).
exclude = ["tests"]

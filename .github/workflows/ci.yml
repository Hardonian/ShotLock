name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests and security scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg (media tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Bandit security scan
        run: |
          pip install bandit
          bandit -q -r src/

      - name: Schemas parse
        run: for f in schemas/*.json; do python -m json.tool "$f" > /dev/null; done
